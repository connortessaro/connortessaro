name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colors match connortessaro.dev: contributions in the slime's blues,
      # eaten by a Ringi-red snake.
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#cf222e&color_dots=#ebedf0,#c6e2ff,#79bbff,#2f81f7,#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff5f7e&color_dots=#161b22,#12345c,#1b5a9a,#3486dc,#5cb8ff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
